limitations_md: |-
  **Esta matriz describe el guion ficticio.** La etiqueta automática «Realizada» significa que la comprobación está representada documentalmente en el escenario, no que se haya ejecutado contra un sistema. Las filas bloqueadas y pendientes muestran cómo registrar límites sin convertirlos en resultados favorables.

  No se desplegó la infraestructura Nimbus, no se enviaron peticiones a los objetivos descritos y no se ejecutaron herramientas de explotación durante la preparación del ejemplo. Las únicas ejecuciones reales corresponden a report-gen y a la validación de los archivos producidos.

  No se representa cobertura de aplicaciones móviles, proveedores de pago, nube pública, phishing, seguridad física, denegación de servicio, persistencia ni revisión completa de código. Los controles positivos de la tabla se limitan a las rutas indicadas. No constituyen una certificación global de seguridad.
