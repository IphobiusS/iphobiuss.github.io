- uid: 9d7fecc2-0be2-523b-b910-79859de46e97
  id: F12
  mode: vuln
  title: Diagnósticos internos expuestos en el panel de soporte
  severity: low
  cvss: '2.7'
  cvss_vector: CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:L/I:N/A:N
  cvss_version: '3.1'
  cwe: CWE-209
  affected: portal.nimbus.example; db.nimbus.example
  description_md: Un error del panel restringido de soporte devuelve la traza, el nombre interno de base
    de datos y rutas de despliegue. El rol soporte-admin necesita funciones operativas de la aplicación,
    pero no acceso a esa información interna del servicio.
  impact_md: Se modela divulgación limitada de estructura y nombres internos a una cuenta con privilegios
    altos de aplicación. La respuesta no contiene contraseñas, tokens ni datos de clientes. No se afirma
    que conocer una versión o una ruta demuestre otra vulnerabilidad.
  remediation_md: Devolver un error genérico con identificador de correlación y guardar el diagnóstico
    en registros de acceso restringido. Desactivar el modo de depuración en entregas públicas y sanear
    los campos que puedan incluir secretos o datos personales.
  references:
  - https://cwe.mitre.org/data/definitions/209.html
  - https://cheatsheetseries.owasp.org/cheatsheets/Error_Handling_Cheat_Sheet.html
  walkthrough:
  - lead: Contexto y precondiciones.
    text_md: El fallo aparece en una vista administrativa del panel de soporte. Una cuenta ordinaria no
      alcanza ese endpoint. La condición evita inflar el riesgo como si fuera una divulgación pública
      sin autenticación.
  - lead: Comprobar el requisito de privilegios.
    text_md: Comparar la respuesta de una cuenta ordinaria con la de soporte-admin. La primera recibe
      un rechazo de autorización. PR:H registra que se necesita un rol de administración de la aplicación
      antes de alcanzar el comportamiento vulnerable.
  - lead: Identificar información adicional.
    text_md: E12 muestra el tipo de excepción, el nombre de una base y una ruta de aplicación. Se conserva
      una representación sintética de esos valores. La diferencia frente a un identificador de error es
      que aporta estructura interna que el cliente no necesita para completar la operación.
    figure:
      src: img/e12.png
      caption: 'E12. Evidencia sintética: La fuga es limitada y requiere un rol privilegiado; no se atribuyen
        consecuencias adicionales. No es una captura de una prueba ejecutada.'
  - lead: Evitar encadenamientos no acreditados.
    text_md: El informe no transforma el nombre de un motor ni su versión en un CVE aplicable. Tampoco
      atribuye acceso al archivo nombrado. La exposición se valora por sí misma con C:L y sin impacto
      directo en integridad o disponibilidad.
  - lead: Definir una corrección verificable.
    text_md: La respuesta pública debe conservar un identificador utilizable por soporte, mientras la
      traza queda en un canal autorizado. Las pruebas deben comprobar tanto la ausencia de detalles como
      la capacidad de correlacionar el error legítimamente.
  remediation_summary:
    short_md: Desactivar la devolución de trazas al cliente y mantener un identificador de correlación.
      Revisar si los registros internos almacenan parámetros sensibles y limitar quién puede consultarlos.
    medium_md: Unificar el tratamiento de errores de la API y del panel. Probar fallos de validación,
      dependencias y excepciones inesperadas. La aplicación debe mantener códigos y mensajes consistentes
      sin exponer rutas, consultas ni detalles de configuración.
    long_md: Cerrar cuando el diagnóstico solo esté disponible en el canal autorizado y el soporte pueda
      correlacionar el incidente usando DEMO-ERR-1201 como patrón de prueba. El ejemplo mantiene el hallazgo
      abierto, con prioridad menor que las rutas de acceso a datos y privilegios.
  asset_uids:
  - a56b6769-1b56-53fb-bc31-98623f580a97
  - c4a6a297-d869-5139-b533-c8df924abe9c
  evidence_uids:
  - 8f04ba1b-e957-5abf-87c8-b60d01f15bb4
  owner: Equipo de aplicaciones
  due_date: '2026-11-02'
  status: open
  retests: []
