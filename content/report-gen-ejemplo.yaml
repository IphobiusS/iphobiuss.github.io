      notes: Evidencias didácticas, matriz de cobertura y seis retests ficticios.
    - version: '1.0'
      date: '2026-10-02'
      author: Generación con report-gen
      notes: Edición completa para revisión y publicación como muestra.
    distribution: |-
      ### Fechas del escenario

      La ventana ficticia de evaluación es del 21 al 25 de septiembre de 2026. Los retests se sitúan el 30 de septiembre y las fechas objetivo de corrección parten del 2 de octubre. Son fechas narrativas; no acreditan actividad profesional realizada durante ese periodo.

      ### Responsabilidad y procedencia

      | Elemento | Procedencia y alcance |
      | --- | --- |
      | Organización y activos | Inventados para este documento. |
      | Descripciones y resultados | Escenario didáctico redactado con asistencia de IA. |
      | Imágenes de evidencia | Representaciones sintéticas de controles y resultados. |
      | PDF y proyecto | Generados y validados con report-gen 0.21.2. |
      | Recomendaciones | Análisis del escenario y documentación pública citada. |
      | Aceptación del portafolio | Corresponde al titular antes de publicar la muestra. |

      ### Distribución prevista

      Lectura pública como ejemplo de informe. Dentro del escenario, los destinatarios serían dirección técnica, responsables de producto, identidad, infraestructura y DevOps. Se usan funciones en lugar de nombres o correos de personas reales.

      Los IDs F01 a F12 se mantienen estables aunque cambie el orden de presentación. Una corrección comunicada no se transforma en cierre hasta que exista un retest representado con resultado concluyente. No se incluyen firmas de aceptación ni aprobaciones de personas ficticias.
  - key: executive_summary
    summary: |-
      Nimbus Commerce representa una plataforma de pedidos con dos organizaciones clientes, servicios de integración y una infraestructura Windows de apoyo. El escenario examina cómo fallos en autorización, recuperación de cuentas, manejo de secretos y delegación de privilegios podrían afectar a los datos y a la operación.

      La evaluación ficticia contiene **12 hallazgos iniciales: 2 críticos, 5 altos, 4 medios y 1 bajo**. El riesgo más urgente se concentra en dos rutas públicas hacia datos o cuentas y en una delegación de replicación del dominio. El gráfico del resumen conserva las severidades iniciales; no representa el número de problemas que siguen abiertos tras el retest.

      ### Decisiones que requiere el escenario

      1. Contener la búsqueda vulnerable y la recuperación de cuentas hasta verificar sus correcciones. Los retests RT01 y RT02 representan el cierre posterior de esas dos rutas.
      2. Priorizar F07, derechos de replicación, aunque su puntuación técnica sea alta y no crítica. Su alcance transversal justifica una prioridad operativa P0.
      3. Completar F03 y F05: la autorización de lectura y el bloqueo directo de destinos mejoran, pero quedan rutas alternativas de escritura y redirección.
      4. Rotar la credencial de CI y revisar las delegaciones de grupos sin considerar suficiente una limpieza superficial o un aviso de despliegue.

      ### Estado al cierre editorial

      Se representan **4 hallazgos corregidos y verificados**, **5 en corrección**, **1 con corrección comunicada** y **2 abiertos**. Se incluyen seis retests ficticios: cuatro completos y dos parciales. Ocho hallazgos, por tanto, carecen todavía de cierre verificado dentro del escenario.

      Las consecuencias se explican por activos y permisos. El informe evita convertir una lectura de archivo en ejecución remota, una administración local en compromiso probado del dominio o un encabezado CORS en explotación universal. Donde el impacto depende de una condición, esa condición se declara.

      ### Orientación para dirección

      La primera inversión se dirige a fronteras de identidad y permisos: autorización por objeto, recuperación de cuentas y privilegios de servicio. Después se consolida un proceso de entrega que conserve controles de regresión y evidencia de cierre. No se calculan pérdidas monetarias, probabilidad estadística de ataque ni retorno de inversión porque el caso no aporta datos para sostener esas cifras.

      **Todos los resultados de esta sección son ficticios.** Su finalidad es mostrar cómo un informe conecta evidencia, impacto, prioridad y seguimiento.
  - key: risk_posture
    title: Criterios de severidad, prioridad y riesgo residual
    posture: |-
      ### Severidad técnica

      Se utiliza **CVSS 3.1 Base** de manera uniforme para que los doce vectores sean comparables dentro de la muestra. Cada puntuación se calcula con report-gen y se acompaña de su vector. No se mezclan puntuaciones 3.1 y 4.0 ni se presentan las métricas Base como un cálculo de riesgo de negocio.

      | Banda | Intervalo |
      | --- | --- |
      | Crítica | 9,0 a 10,0 |
      | Alta | 7,0 a 8,9 |
      | Media | 4,0 a 6,9 |
      | Baja | 0,1 a 3,9 |
      | Informativa | 0,0 |

      CVSS pertenece a FIRST y se utiliza conforme a su documentación pública. Referencias: https://www.first.org/cvss/v3.1/specification-document y https://www.first.org/cvss/v3.1/user-guide. Los valores reflejan las condiciones inventadas del caso y requerirían una nueva valoración en un entorno real.

      ### Prioridad operativa del escenario

      | Prioridad | Criterio y respuesta propuesta |
      | --- | --- |
      | P0 | Acceso amplio a datos o identidad transversal. Contención y coordinación inmediata. |
      | P1 | Cruce de permisos o privilegios con condiciones identificadas. Corrección prioritaria y retest dirigido. |
      | P2 | Exposición condicionada por sesión, interacción o configuración. Corrección planificada y regresión. |
      | P3 | Divulgación limitada con privilegios previos altos. Incorporación al ciclo de endurecimiento. |

      Estos plazos son una propuesta de trabajo ficticia, no un SLA contractual. F07 ejemplifica la diferencia: obtiene 8,8 por sus requisitos técnicos y recibe P0 por afectar al dominio. F12 queda en P3 porque expone datos internos limitados a un rol ya privilegiado.

      ### Riesgo residual y criterio de cierre

      La severidad inicial se conserva después de corregir para mantener trazabilidad. El estado de seguimiento indica si la ruta sigue abierta. Un parche anunciado, una respuesta HTTP distinta o una regla que bloquea un único ejemplo no bastan para cerrar el hallazgo.

      En este documento se exige un control negativo, un control legítimo que siga funcionando y una explicación del alcance probado. Un retest parcial mantiene el hallazgo en corrección. La aceptación de un riesgo, si existiera, necesitaría responsable, justificación, vencimiento y controles compensatorios; no se inventa ninguna aceptación en esta muestra.
  - key: scope
    objectives: |-
      ### Objetivo del escenario

      Evaluar cómo una persona sin sesión, una cuenta de cliente o una identidad operativa podrían superar las fronteras de datos y administración. El caso conecta entrada, permiso efectivo, resultado y corrección.

      ![Arquitectura ficticia de Nimbus: portal, API, identidad, datos, archivos e infraestructura.](img/arquitectura.png)

      El inventario final amplía estas relaciones con las funciones y los vínculos a hallazgos.
    assumptions: |-
      El guion combina caja gris web/API y revisión interna con dos organizaciones canario. Las comprobaciones de AD parten de credenciales proporcionadas; no se deduce una entrada desde Internet al dominio.

      Quedan fuera terceros, producción, datos personales, phishing, carga, persistencia y operaciones destructivas. Nimbus es ficticia y este documento no autoriza pruebas sobre ningún servicio. Una ejecución real exigiría alcance, ventanas, contactos y reglas de enfrentamiento acordados por escrito.
  - key: methodology
    approach: |-
      El caso sigue una secuencia de hipótesis, control positivo, variación mínima, comprobación independiente y cierre. Cada hallazgo delimita qué demostraría su evidencia y qué no. Cuando la observación puede tener otra explicación, se añade una comparación: otra identidad, otro objeto, una sesión nueva o un destino de control.

      La revisión de configuración y la comprobación de comportamiento se distinguen. Ver un permiso peligroso puede sostener una condición de riesgo; la capacidad atribuida debe contrastarse con la semántica del permiso y las condiciones del escenario. Un resultado aislado de un escáner no se presenta como prueba concluyente.
    standards: |-
      Se consultan las guías de OWASP para autorización, consultas parametrizadas, recuperación de cuentas, SSRF, sesiones, XSS y gestión de secretos. CWE se usa para clasificar la causa técnica. La documentación de Microsoft ayuda a interpretar las delegaciones de Active Directory y FIRST define la puntuación CVSS.

      Estas referencias orientan el análisis; no se afirma cumplimiento integral de OWASP ASVS, ISO 27001, PCI DSS ni otra certificación. Las fuentes específicas aparecen en cada hallazgo y se reúnen en el apéndice.
    information_gathering: El inventario aporta ocho activos ficticios, responsables funcionales, roles
      y fronteras de confianza. Antes de variar una entrada se establece la identidad efectiva y el objeto
      canario. Se conservan identificadores de petición de demostración para vincular el control con su
      resultado, sin introducir datos de personas reales.
    exploitation: Las evidencias son diagramas de resultados sintéticos, no capturas de ataques. En un
      ejercicio equivalente, las validaciones descritas se limitarían a objetos canario y cambios reversibles.
      En este documento no se ejecutan esas acciones. Las métricas de impacto modelan capacidades concretas;
      las no sustentadas se excluyen o se señalan como consecuencias potenciales.
    cleanup: 'Cada modificación canario del relato incluye restauración o revocación como parte del criterio
      de cierre: notas de pedidos, contraseñas, sesiones, membresías y etiquetas de trabajos. Esa limpieza
      es también ficticia. La preparación real del informe solo crea archivos de proyecto y exportaciones
      en el entorno de trabajo.'
  - key: findings_summary
  - key: findings
  - key: attack_narrative
    title: Cadenas de impacto y fronteras de confianza
    narrative: |-
      ### Ruta A: entrada pública y datos de pedidos

      F01 modela una entrada pública que altera la consulta de búsqueda. La raíz es la mezcla de código y datos, agravada por una cuenta con permisos de escritura. La lectura y el cambio canario sostienen dos efectos distintos; no se extiende el relato a ejecución en el sistema operativo. RT01 representa la corrección de ambas condiciones relevantes.

      F02 ofrece una vía independiente a cuentas del portal: el token de recuperación no queda vinculado a su sujeto. No necesita F01 para funcionar. Separar ambos hallazgos evita presentar una larga cadena artificial que haga parecer dependientes dos problemas con causas y correcciones diferentes.

      ### Ruta B: usuario legítimo y frontera entre organizaciones

      En F03, el atacante del escenario ya dispone de una cuenta válida. El fallo aparece al resolver un objeto por ID sin aplicar la política de organización. F04 afecta a otra frontera: la ubicación de un archivo y su pertenencia al pedido. Cambiar IDs por UUIDs no corrige ninguna de esas dos autorizaciones.

      F05 amplía las capacidades del mismo tipo de usuario a través de una petición del servidor. La confianza en el origen interno del tráfico contribuye al impacto. El retest que solo bloquea la URL directa deja pendiente el destino efectivo después de una redirección.

      ### Ruta C: identidades operativas y privilegios

      F06 relaciona lectura de artefactos con uso de una identidad de servicio más poderosa. El secreto representa un cambio de identidad; eliminar una copia sin revocarlo no corta la ruta.

      F07 y F08 parten de identidades internas proporcionadas. No se afirma que el hallazgo web haya permitido alcanzar esas cuentas. F07 modela derechos de replicación del dominio; F08 termina en administración de WINAPP01. El informe mantiene separados el control potencial del dominio y la administración local de un servidor.

      ### Qué conviene cortar primero

      La respuesta prioriza las fronteras que concentran permisos: identidad del sujeto, pertenencia del objeto, destino de red y delegación administrativa. Los controles locales ayudan, pero el cierre exige verificar el camino completo. Por ejemplo, corregir GET sin revisar PATCH mejora la lectura y deja abierto el cambio de datos.

      ### Controles positivos conservados

      El escenario incluye rechazo de usuarios anónimos en perfil y de usuarios ordinarios en el panel administrativo. Esos resultados muestran que parte de la autenticación y de los roles funciona. No invalidan los fallos de objeto, sesión o recuperación, ni permiten declarar segura toda la plataforma.

      Cada ruta aquí descrita es una explicación del modelo ficticio. No representa una intrusión, una prueba de lateralidad ejecutada ni un incidente detectado.
  - key: remediation_plan
    overview: |-
      El plan conserva las dependencias entre contención, cambio y verificación. Los responsables y fechas son una propuesta del escenario. Las tareas cerradas permanecen en el registro para explicar qué se verificó; no se eliminan del informe inicial.

      | ID | Prioridad | Responsable propuesto | Fecha objetivo |
      | --- | --- | --- | --- |
      | F01 | P0 | Equipo de aplicaciones | 2026-10-03 |
      | F02 | P0 | Equipo de identidad | 2026-10-03 |
      | F03 | P1 | Equipo de API | 2026-10-09 |
      | F04 | P1 | Equipo de API | 2026-10-09 |
      | F05 | P1 | Equipo de plataforma | 2026-10-09 |
      | F06 | P1 | Equipo de DevOps | 2026-10-05 |
      | F07 | P0 | Equipo de identidad | 2026-10-03 |
      | F08 | P1 | Equipo de infraestructura | 2026-10-09 |
      | F09 | P2 | Equipo de aplicaciones | 2026-10-23 |
      | F10 | P2 | Equipo de API | 2026-10-23 |
      | F11 | P2 | Equipo de identidad | 2026-10-23 |
      | F12 | P3 | Equipo de aplicaciones | 2026-11-02 |

      Una fecha objetivo no prueba que un cambio esté realizado. El apartado de seguimiento refleja el estado: cuatro cierres representados, dos correcciones parciales, una corrección comunicada sin retest y cinco casos adicionales sin cierre. La tabla de fechas sirve para gestionar el trabajo; no es un compromiso de una organización real.
    short_term: |-
      ### Contener y preservar contexto

      Priorizar F07 y confirmar la continuidad de los cierres F01 y F02. La retirada de derechos debe coordinarse con las funciones legítimas de inventario y replicación. Para F06, revocar el secreto anterior y revisar sus permisos antes de dar por concluida la retirada de artefactos.

      Designar un responsable de cada cambio y un verificador distinto dentro del modelo organizativo. Registrar versión desplegada, alcance de la corrección y pruebas esperadas. Preservar registros relevantes con minimización de datos; no copiar tokens completos a tickets o documentos.

      **Salida de esta fase:** rutas prioritarias contenidas, responsables asignados y comprobaciones de cierre concretas. Ningún estado se cambia a verificado por el mero envío de un aviso de despliegue.
    medium_term: |-
      ### Corregir causas comunes

      Completar las matrices de autorización de F03 y la política de destinos de F05. Revisar las demás operaciones que reutilizan el mismo componente. Confirmar F08 con una sesión nueva y permisos efectivos; revisar F09, F10 y F11 como problemas distintos de navegador, origen y ciclo de sesión.

      Para cada cambio, conservar una prueba negativa y un flujo legítimo. Un sistema que bloquea toda descarga o toda integración puede detener el caso, pero no demuestra una corrección funcional aceptable. Verificar también paginación, exportaciones y consumidores secundarios de la misma API.

      **Salida de esta fase:** retests completos de las rutas pendientes, regresiones incorporadas y excepciones documentadas. Las correcciones parciales mantienen fecha, responsable y alcance residual visible.
    long_term: |-
      ### Mantener y volver a comprobar

      Convertir autorización, gestión de secretos y delegación de privilegios en revisiones repetibles del ciclo de cambios. Mantener un inventario de identidades de servicio y de sus permisos; revisar las delegaciones de grupos cuando cambien equipos o funciones.

      Usar indicadores que midan resultados: hallazgos sin cierre verificado, correcciones parciales repetidas, antigüedad por prioridad y porcentaje de cambios con prueba de regresión. No se asignan valores de rendimiento a esos indicadores porque no hay una operación real de la que obtenerlos.

      **Salida de esta fase:** un registro sostenible de decisiones, evidencias y responsables. Si un riesgo se acepta, debe tener justificación y vencimiento; la ausencia de tiempo para comprobarlo no debe convertirse automáticamente en aceptación.
  - key: appendix
    title: Apéndices técnicos y referencias
    changes_cleanup: |-
      ### Registro de cambios del escenario

      | Caso | Cambio representado | Restitución descrita |
      | --- | --- | --- |
      | F01 | Nota interna de pedido canario | Valor anterior restaurado. |
      | F02 | Contraseña administrativa de demostración | Restablecimiento y revocación de sesiones. |
      | F03 | Nota de entrega de otra organización | Valor restaurado tras control con la segunda cuenta. |
      | F05 | Etiqueta de trabajo de documentos | Etiqueta original recuperada. |
      | F08 | Miembro canario en grupo administrador | Miembro retirado y sesión de prueba cerrada. |
      | F09 | Comentario con marcador de DOM | Comentario de demostración eliminado del relato. |
      | F11 | Preferencia de usuario | Valor inicial restaurado. |

      Esta tabla narra el procedimiento previsto en la ficción. No es un acta de limpieza de sistemas reales. Las pruebas de lectura no se convierten en modificaciones ni se atribuyen acciones adicionales para alargar la cadena.
    tools_used: |-
      ### Ejecuciones reales y herramientas del escenario

      **Ejecutado para producir los archivos:** report-gen 0.21.2, su calculadora CVSS, exportadores y validación del proyecto; herramientas locales de inspección y renderizado del PDF. El registro técnico del paquete detalla las comprobaciones realizadas sobre los archivos.

      **Solo descrito como metodología:** proxy HTTP, navegador, cliente de API y revisión de permisos de Active Directory. No se incluyen versiones de escáneres, registros de comandos ni duraciones de pruebas que no se hayan ejecutado. Las imágenes E01 a E12 y RT01 a RT10 incluidas son representaciones didácticas.

      ### Referencias generales

      - FIRST, CVSS 3.1, especificación: https://www.first.org/cvss/v3.1/specification-document
      - FIRST, guía de uso: https://www.first.org/cvss/v3.1/user-guide
      - OWASP, API Security 2023, autorización por objeto: https://owasp.org/API-Security/editions/2023/en/0xa1-broken-object-level-authorization/
      - Microsoft, derechos de replicación: https://learn.microsoft.com/en-us/windows/win32/adschema/r-ds-replication-get-changes-all
      - Microsoft, protección de Active Directory: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/best-practices-for-securing-active-directory

      Las referencias específicas de prevención y las clasificaciones CWE aparecen en la ficha de cada hallazgo. Son apoyo técnico para interpretar el caso, no una declaración de que las organizaciones citadas revisaron este documento.
    glossary: |-
      | Término | Uso en este informe |
      | --- | --- |
      | Canario | Objeto o identidad de prueba que permite una comprobación acotada. |
      | BOLA | Fallo de autorización al acceder a un objeto mediante su identificador. |
      | Tenant | Organización lógica cuyos datos deben mantenerse separados. |
      | SSRF | Petición realizada por un servidor hacia un destino controlado por una entrada. |
      | ACL | Lista de permisos asociada a un recurso o un objeto. |
      | CVSS Base | Puntuación de severidad técnica para condiciones declaradas. |
      | Prioridad | Orden operativo propuesto según el contexto del caso. |
      | Retest | Nueva comprobación de una corrección y sus límites. |
      | Corrección parcial | Una ruta queda resuelta y otra continúa abierta. |
      | Evidencia sintética | Representación editorial; no una observación de un sistema real. |

      ### Reutilización del proyecto

      El respaldo editable incluye el YAML y las imágenes vinculadas para importarlo con «Abrir respaldo» en report-gen. El Markdown conserva el contenido para revisión textual. Las modificaciones del proyecto deben exportarse de nuevo para que las tablas, los estados y el informe reflejen la misma versión. Cambiar solamente el PDF rompe esa correspondencia.
  workflow:
    include_assets: true
    include_coverage: true
    include_retest: true
findings:
- uid: d8eecceb-7bfb-575f-9af6-5419615e74f5
  id: F01
  mode: vuln
  title: Inyección SQL en el buscador de pedidos
  severity: critical
  cvss: '9.1'
  cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N
  cvss_version: '3.1'
  cwe: CWE-89
  affected: portal.nimbus.example; db.nimbus.example
  description_md: El buscador público construye una condición SQL concatenando el parámetro `q`. La cuenta
    de servicio comparte permisos de lectura y actualización con el módulo de pedidos. En el escenario,
    una entrada controlada altera la consulta y permite acceder a registros de prueba ajenos al resultado
    esperado.
  impact_md: El modelo contempla lectura y modificación de datos de pedidos sin autenticación. La evidencia
    didáctica muestra dos registros canario y una actualización reversible en una copia aislada. No se
    atribuye impacto de disponibilidad ni compromiso del sistema operativo.
  remediation_md: Separar código y datos mediante consultas parametrizadas; usar una cuenta de solo lectura
    para búsquedas. Aplicar autorización antes de devolver pedidos y conservar pruebas de regresión. Escapar
    comillas o filtrar palabras SQL no sustituye estas medidas.
  references:
  - https://cwe.mitre.org/data/definitions/89.html
  - https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
  walkthrough:
  - lead: Contexto y precondiciones.
    text_md: El flujo público permite consultar el estado de un envío con una referencia. Se dispone de
      una copia de datos sintéticos con los pedidos DEMO-1001 y DEMO-1002. El caso se limita a esa copia;
      no plantea una extracción masiva ni acceso a información de personas.
  - lead: Establecer la respuesta de referencia.
    text_md: Consultar DEMO-1001 y guardar el identificador de petición, el código HTTP y los campos devueltos.
      Repetir con una referencia inexistente. El primer control devuelve un registro y el segundo ninguno;
      esta pareja permite separar el comportamiento normal de un fallo de caché.
  - lead: Comparar dos condiciones controladas.
    text_md: En la representación E01 se contrasta una condición verdadera con una falsa. El resultado
      cambia con la condición SQL y no solamente con el texto visible del buscador. El registro canario
      del segundo pedido muestra el cruce de la frontera de datos. Las entradas concretas del ensayo se
      conservan como casos de regresión, sin automatizar enumeraciones.
    figure:
      src: img/e01.png
      caption: 'E01. Evidencia sintética: La condición controla la consulta; la prueba se limita a datos
        canario. No es una captura de una prueba ejecutada.'
  - lead: Acotar la capacidad de modificación.
    text_md: El guion de la demostración incluye la modificación reversible del campo interno demo_note
      en DEMO-1002 sobre la copia aislada. El acceso de escritura se atribuye a los permisos de la cuenta
      de base de datos, no a una supuesta ejecución de comandos. La operación vuelve a su valor inicial
      al finalizar.
  - lead: Interpretar la evidencia y la puntuación.
    text_md: AV:N y PR:N corresponden al punto de entrada público; AC:L y UI:N reflejan una petición directa.
      C:H e I:H describen las capacidades modeladas sobre la base de pedidos. A:N evita puntuar una interrupción
      no representada. Este vector es una valoración del escenario, no una medición de una empresa real.
  remediation_summary:
    short_md: Contener el endpoint de búsqueda y separar sus permisos de escritura. Antes de reabrirlo,
      conservar los registros técnicos necesarios para investigar solicitudes anómalas, sin almacenar
      credenciales ni cuerpos completos de pedidos.
    medium_md: Reescribir la consulta con parámetros y comprobar todos los filtros dinámicos, incluidos
      orden y paginación. La prueba negativa debe incluir comillas, expresiones booleanas y referencias
      de otro cliente. Los resultados normales deben mantenerse para no introducir una regresión funcional.
    long_md: Incorporar revisión de acceso a datos en cambios del ORM y de SQL manual. Cerrar el ticket
      solo si las consultas canario dejan de ampliar resultados, no se aceptan modificaciones desde búsqueda
      y los controles de autorización siguen funcionando.
  asset_uids:
  - a56b6769-1b56-53fb-bc31-98623f580a97
  - c4a6a297-d869-5139-b533-c8df924abe9c
