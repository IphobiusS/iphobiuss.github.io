report:
  sections:
  - key: confidentiality
    title: Naturaleza del documento y uso de la muestra
    body: |-
      **INFORME FICTICIO DE DEMOSTRACIÓN.** Nimbus Commerce es una organización inventada para mostrar las capacidades de report-gen y una forma de documentar una evaluación de seguridad. No es un cliente, una auditoría realizada, una certificación ni un informe de incidente real.

      Los hallazgos, activos, personas, fechas de trabajo, evidencias y resultados de retest forman parte de un escenario editorial. Las imágenes técnicas son representaciones sintéticas identificadas como tales. No son capturas de sistemas comprometidos. Las frases que describen acciones o resultados se interpretan dentro de ese escenario.

      ### Qué es verificable en esta entrega

      El proyecto estructurado se procesa con report-gen 0.21.2. Las puntuaciones se calculan a partir de los vectores declarados; el informe conserva referencias entre hallazgos, activos y evidencias. El paquete editable permite revisar los campos y volver a exportar el documento con la herramienta. La reproducción del informe no equivale a reproducir un ataque.

      ### Finalidad y límites de publicación

      Esta muestra se prepara para el portafolio de Sebastián Latorre Muñoz, iphobiuss, con redacción asistida por IA. Puede presentarse como demostración de la herramienta y de estructura de reportería, manteniendo esta identificación. No debe presentarse como experiencia con un cliente ni como prueba de que las acciones descritas fueron ejecutadas por el titular del portafolio.

      Los nombres terminados en `.example`, los identificadores DEMO y los marcadores de credenciales se usan como datos de ejemplo. Ningún secreto del documento es operativo. Las referencias externas corresponden a documentación técnica pública; sus autores no avalan este caso ficticio.

      ### Cómo leerlo

      Dirección puede empezar por el resumen ejecutivo, la postura de riesgo y el plan de remediación. Los equipos técnicos encontrarán causa raíz, límites, controles de comparación y criterios de cierre en cada hallazgo. La parte final conserva el inventario, la cobertura del guion y el seguimiento de correcciones.

      **Fecha de preparación: 2 de octubre de 2026. Versión editorial: 1.0. Clasificación: muestra pública ficticia.**
  - key: document_control
    version_history:
    - version: '0.1'
      date: '2026-10-02'
      author: Preparación asistida
      notes: Definición del escenario, doce hallazgos y activos sintéticos.
    - version: '0.2'
      date: '2026-10-02'
