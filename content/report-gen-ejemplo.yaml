- uid: 6e67a7d5-f64b-5f78-b973-1fa94a8815e4
  id: F02
  mode: vuln
  title: Recuperación de contraseña sin vínculo entre token y cuenta
  severity: critical
  cvss: '9.1'
  cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N
  cvss_version: '3.1'
  cwe: CWE-640
  affected: portal.nimbus.example; auth.nimbus.example
  description_md: La API comprueba que un token de recuperación exista y no haya expirado, pero utiliza
    el identificador de cuenta enviado en el cuerpo para seleccionar qué contraseña cambia. Falta comprobar
    que ambos valores pertenecen a la misma solicitud de recuperación.
  impact_md: En el escenario, un token emitido para una cuenta controlada permite cambiar la contraseña
    de otra cuenta canario, incluida una cuenta administrativa sin segundo factor. Se modela acceso a
    datos y operaciones del portal; no se presupone acceso a Active Directory.
  remediation_md: Resolver la cuenta exclusivamente desde el registro de recuperación del servidor. Vincular
    token, propósito, cuenta y caducidad; consumirlo una sola vez. Invalidar las sesiones afectadas y
    exigir controles adicionales en la recuperación de cuentas privilegiadas.
  references:
  - https://cwe.mitre.org/data/definitions/640.html
  - https://cheatsheetseries.owasp.org/cheatsheets/Forgot_Password_Cheat_Sheet.html
  walkthrough:
  - lead: Contexto y precondiciones.
    text_md: Se utilizan las identidades ficticias usuario.a y admin.demo. Ambas pertenecen al escenario
      y sus buzones son sintéticos. El flujo público de recuperación emite un token para usuario.a; no
      se necesita una sesión autenticada para enviar la solicitud final.
  - lead: Preparar un control legítimo.
    text_md: Solicitar recuperación para usuario.a y comprobar que el token permite modificar únicamente
      esa identidad. Registrar su fecha de expiración y propósito. La mera existencia de un token válido
      no concede autorización para elegir una cuenta distinta.
  - lead: Variar solamente la cuenta objetivo.
    text_md: 'Mantener el mismo token canario y reemplazar account_id por la identidad administrativa
      de demostración. E02 representa una respuesta de éxito y el posterior inicio de sesión con la contraseña
      de prueba. Un 200 aislado no bastaría: el cambio de identidad se acredita con el resultado posterior
      dentro del guion.'
    figure:
      src: img/e02.png
      caption: 'E02. Evidencia sintética: El servidor acepta que el cliente elija una identidad distinta
        de la del token. No es una captura de una prueba ejecutada.'
  - lead: Descartar un cambio aparente.
    text_md: Comparar el identificador de la sesión nueva, el rol efectivo y una operación canario de
      administración. Restituir la contraseña inicial y revocar las sesiones del ejercicio. Las contraseñas
      y tokens se muestran como etiquetas ficticias, no como secretos utilizables.
  - lead: Fijar los límites.
    text_md: C:H e I:H se apoyan en el rol administrativo modelado; A:N evita asumir capacidad de interrupción.
      Si una instalación real impusiera MFA resistente a la recuperación, la cadena y la valoración requerirían
      revisión. El problema es el vínculo de identidad, no la longitud del token.
  remediation_summary:
    short_md: Restringir la recuperación de cuentas privilegiadas y revisar los registros de cambios de
      contraseña. Aplicar un control servidor que compare la identidad del token antes de escribir cualquier
      cambio, sin informar si la cuenta objetivo existe.
    medium_md: Eliminar account_id del contrato de confirmación, o rechazar cualquier discrepancia si
      debe mantenerse por compatibilidad. Probar token caducado, reutilizado, de otra cuenta y de otro
      propósito. La invalidación debe ser atómica para evitar consumos simultáneos.
    long_md: Documentar el ciclo completo de recuperación y sus controles de MFA y sesiones. Una prueba
      automatizada con dos identidades debe fallar si un token modifica la cuenta equivocada. Registrar
      el evento con identificadores, nunca el token íntegro.
  asset_uids:
  - a56b6769-1b56-53fb-bc31-98623f580a97
  - 3855f32e-8146-5d1b-b417-9eccc2e47140
  evidence_uids:
  - 80147432-b232-5313-a68c-abd091976852
  owner: Equipo de identidad
  due_date: '2026-10-03'
  status: verified_fixed
  retests:
  - uid: 0f4de915-fe69-5b72-b10a-3f40436985e3
    result: fixed
    tested_on: '2026-09-30'
    assessor: Evaluador ficticio del escenario
    notes_md: Retest ficticio RT02. El servidor obtiene el sujeto desde el token. La combinación cruzada
      se rechaza; un token válido funciona solo una vez para su cuenta. Los tokens vencidos y reutilizados
      también fallan. Se representa la invalidación de sesiones anteriores de la cuenta recuperada.
    evidence_uids:
    - fa3f37c7-3b45-5d65-82ff-57eeec78fae7
- uid: ff162b64-4c38-5385-8afe-784e5edfe6a4
  id: F03
  mode: vuln
  title: Acceso y modificación de pedidos de otra organización
  severity: high
  cvss: '8.1'
  cvss_vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N
  cvss_version: '3.1'
  cwe: CWE-639
  affected: api.nimbus.example
  description_md: GET y PATCH de pedidos validan la sesión, pero buscan el objeto por su identificador
    global sin filtrar por organización. Un miembro de demo-a puede leer y modificar un pedido de demo-b
    conociendo su identificador.
  impact_md: Se modela exposición de pedidos y modificación de sus datos de entrega entre organizaciones.
    La modificación canario afecta solo a una nota de entrega reversible. No se afirma acceso a tarjetas
    de pago, ejecución de órdenes bancarias ni compromiso del proveedor de pagos.
  remediation_md: Aplicar autorización por objeto en lectura y escritura, usando la organización y el
    rol resueltos desde la sesión del servidor. Reutilizar la misma política en exportaciones, procesos
    por lotes y endpoints heredados. Un UUID difícil de adivinar no reemplaza ese control.
  references:
  - https://cwe.mitre.org/data/definitions/639.html
  - https://owasp.org/API-Security/editions/2023/en/0xa1-broken-object-level-authorization/
  walkthrough:
  - lead: Contexto y precondiciones.
    text_md: Hay dos organizaciones ficticias, demo-a y demo-b, con dos cuentas de usuario distintas y
      pedidos propios. La sesión A permanece idéntica durante los controles. Los identificadores se obtienen
      del conjunto de prueba autorizado; no se utiliza fuerza bruta.
  - lead: Confirmar separación de identidades.
    text_md: Guardar el subject y tenant de cada sesión. Comprobar primero que A accede a su pedido y
      B al suyo. Evitar reutilizar cookies de la cuenta B al comprobar el acceso cruzado, porque eso produciría
      una falsa conclusión de BOLA.
  - lead: Probar lectura y escritura por separado.
    text_md: Con la sesión A, pedir el objeto de B y después cambiar su campo delivery_note. La lectura
      y la modificación son comprobaciones diferentes. E03 representa ambos resultados y la lectura de
      control con B que confirma el cambio canario.
    figure:
      src: img/e03.png
      caption: 'E03. Evidencia sintética: La identidad está autenticada, pero el objeto no está autorizado
        para ella. No es una captura de una prueba ejecutada.'
  - lead: Comprobar rutas alternativas.
    text_md: 'Repetir la matriz en el endpoint de exportación y en el PATCH del recurso. El retest ficticio
      muestra una corrección parcial: GET aplica la política, pero PATCH sigue permitiendo la escritura
      cruzada. El ticket permanece abierto aunque una de las rutas ya esté corregida.'
  - lead: Interpretar el resultado.
    text_md: La autenticación de A funciona; falla la autorización sobre el objeto. PR:L refleja ese acceso
      de usuario. C:H e I:H describen el alcance entre organizaciones modelado, y A:N no incorpora denegación
      de servicio. Deben revisarse también IDs anidados y operaciones por lotes.
  remediation_summary:
    short_md: Deshabilitar las rutas cruzadas identificadas y revisar accesos por tenant. Evitar una respuesta
      que revele atributos del objeto rechazado. Mantener una forma controlada de atender pedidos legítimos
      mientras se despliega el cambio.
    medium_md: Introducir un punto común de decisión de autorización con tenant, rol, objeto y operación.
      Añadir una matriz positiva y negativa de dos organizaciones a GET, PATCH, exportación y procesos
      por lotes. Revisar que tenant_id no pueda sobreescribirse desde el cuerpo del cliente.
    long_md: Cerrar solo después de que todas las operaciones cruzadas fallen y las legítimas sigan funcionando.
      El cambio debe incluir comprobaciones de concurrencia si existe una transferencia de pedido entre
      organizaciones, y controles de caché que respeten esa separación.
  asset_uids:
  - 7993cf01-787a-590b-833f-59bb95756739
  evidence_uids:
  - 6fa1123a-d031-5e56-9138-2b62cd11ac0b
  owner: Equipo de API
  due_date: '2026-10-09'
  status: in_progress
  retests:
  - uid: c0396008-a47c-526b-9c64-73c4c2e0d214
    result: partial
    tested_on: '2026-09-30'
    assessor: Evaluador ficticio del escenario
    notes_md: Retest ficticio RT03. GET devuelve 404 para el objeto de otra organización. PATCH todavía
      admite el cambio de delivery_note y se confirma con la cuenta B. El resultado es parcial y F03 continúa
      en corrección. La ausencia de lectura cruzada no elimina el impacto de integridad.
    evidence_uids:
    - ea51aaf3-9470-510f-8357-db6babb39175
- uid: 09726a34-a8d5-5f3e-9738-0cf0df7669dc
  id: F04
  mode: vuln
  title: Lectura fuera del directorio permitido de adjuntos
  severity: medium
  cvss: '6.5'
  cvss_vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N
  cvss_version: '3.1'
  cwe: CWE-22
  affected: api.nimbus.example; files.nimbus.example
  description_md: La descarga de adjuntos concatena una ruta suministrada por el usuario con la carpeta
    de almacenamiento. No comprueba que la ruta normalizada permanezca dentro del directorio autorizado
    ni que el fichero pertenezca al pedido.
  impact_md: El escenario permite leer un archivo canario fuera de la carpeta de adjuntos. El proceso
    tiene acceso de lectura a configuraciones internas del servicio. Se modela impacto de confidencialidad;
    no se representan escritura de archivos, ejecución de código ni acceso ilimitado al host.
  remediation_md: Recibir un identificador de adjunto y resolver su ubicación en el servidor después de
    autorizar el objeto. Si se manejan rutas, normalizarlas y verificar su pertenencia real al directorio
    permitido, considerando enlaces simbólicos. Reducir los permisos del proceso.
  references:
  - https://cwe.mitre.org/data/definitions/22.html
  walkthrough:
  - lead: Contexto y precondiciones.
    text_md: El servicio FILES01 contiene una carpeta attachments y otra fixtures con un canario llamado
      outside-marker.txt. Ambos son recursos ficticios. La prueba cruza esa frontera controlada; no depende
      de leer archivos reales del sistema ni secretos.
  - lead: Establecer un adjunto legítimo.
    text_md: Descargar un documento de la propia organización y registrar su tipo, tamaño y asociación
      al pedido. Comparar con un identificador inexistente y uno de otro tenant. La validación de ruta
      y la autorización de objeto son controles complementarios.
  - lead: Representar el escape de directorio.
    text_md: E04 contrasta una descarga normal con una ruta que alcanza el archivo canario situado fuera
      de attachments. Se comparan contenidos, no solo códigos HTTP. La presencia exacta del marcador F04-OUTSIDE
      diferencia la lectura indebida de una página de error.
    figure:
      src: img/e04.png
      caption: 'E04. Evidencia sintética: El marcador procede de un recurso exterior al directorio autorizado.
        No es una captura de una prueba ejecutada.'
  - lead: Cubrir normalización y enlaces.
    text_md: El guion contempla segmentos relativos y un enlace simbólico dentro de attachments que apunta
      a fixtures. Una comprobación puramente textual del prefijo no demuestra contención. Debe validarse
      el destino efectivo y evitar cambios concurrentes del enlace durante la apertura.
  - lead: Mantener el alcance de la conclusión.
    text_md: C:H se basa en la lectura de configuraciones que el modelo concede al proceso; I:N y A:N
      no atribuyen otras capacidades. En una evaluación real se ajustarían las métricas al conjunto de
      archivos realmente accesible. El canario prueba la frontera, no la exposición de todos los discos.
  remediation_summary:
    short_md: Restringir el endpoint y revisar los permisos de lectura del servicio. Sustituir las rutas
      expuestas por identificadores internos. Conservar un canario de pruebas separado de configuraciones
      y credenciales para las verificaciones posteriores.
    medium_md: Centralizar la resolución de adjuntos y la política de pertenencia al pedido. Probar traversal,
      enlaces simbólicos, nombres codificados, fichero inexistente y adjunto de otro tenant. La corrección
      debe rechazar el acceso sin revelar la ruta absoluta en el error.
    long_md: Incorporar pruebas de aislamiento del almacenamiento a las actualizaciones del framework
      y a las migraciones de volumen. Verificar que una descarga normal no cambie y que el usuario del
      servicio no pueda leer material de otros componentes.
  asset_uids:
  - 7993cf01-787a-590b-833f-59bb95756739
  - 9a4db157-7733-5b63-8337-4eddedc0bbd5
  evidence_uids:
  - d595880a-3c59-575c-bd60-2d0e0f95aa2c
  owner: Equipo de API
  due_date: '2026-10-09'
  status: verified_fixed
  retests:
  - uid: 005b6efe-e985-52af-a6db-974e30184944
    result: fixed
    tested_on: '2026-09-30'
    assessor: Evaluador ficticio del escenario
    notes_md: Retest ficticio RT04. La API recibe IDs de adjunto y autoriza pedido y organización antes
      de resolver el archivo. Los canarios exteriores y el enlace simbólico se rechazan. El adjunto legítimo
      conserva su contenido y tamaño. El escenario representa el cierre del hallazgo.
    evidence_uids:
    - 00c75341-d1a9-568d-bcfb-7d885227d4c8
- uid: 6657a3dc-47b0-58c8-bf95-2ea6287f62ac
  id: F05
  mode: vuln
  title: SSRF en la vista previa de integraciones
  severity: high
  cvss: '7.1'
  cvss_vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:L/A:N
  cvss_version: '3.1'
  cwe: CWE-918
  affected: api.nimbus.example; files.nimbus.example
  description_md: La función de vista previa solicita una URL indicada por el usuario y devuelve la respuesta.
    Permite seleccionar método y cuerpo, y sigue redirecciones sin aplicar una política de destino en
    cada salto. El servicio alcanza una interfaz interna que confía en la red de origen.
  impact_md: El escenario representa lectura de configuraciones y cambios limitados en un trabajo canario
    del servicio interno de documentos. No se modela acceso a metadata de un proveedor cloud, obtención
    de credenciales reales ni ejecución de comandos.
  remediation_md: Sustituir URLs arbitrarias por integraciones predefinidas. Limitar destinos, puertos
    y métodos, validar la resolución y cada redirección, y aplicar controles de salida de red. Exigir
    autenticación y autorización propias en la interfaz interna.
  references:
  - https://cwe.mitre.org/data/definitions/918.html
  - https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
  walkthrough:
  - lead: Contexto y precondiciones.
    text_md: La cuenta de integración tiene permisos bajos en la API. La prueba utiliza un receptor canario
      y un servicio interno ficticio de documentos. Se conocen ambos destinos por el inventario del ejercicio;
      no se realizan barridos de puertos ni descubrimiento de direcciones ajenas.
  - lead: Observar una integración autorizada.
    text_md: Enviar una URL del receptor canario y comparar el identificador de correlación que recibe
      con el de la API. El escenario distingue una conexión realizada por el servidor de una petición
      del navegador. La respuesta visible debe corresponder al mismo identificador.
  - lead: Comprobar una frontera interna.
    text_md: Pedir a la vista previa el recurso canario interno. E05 representa que la API devuelve información
      de configuración reservada para la red de servicios. El impacto de integridad se limita a cambiar
      una etiqueta del trabajo DEMO-JOB-05, operación reversible incluida en el modelo.
    figure:
      src: img/e05.png
      caption: 'E05. Evidencia sintética: La confianza en la red interna amplía el alcance de una entrada
        controlada. No es una captura de una prueba ejecutada.'
  - lead: Evaluar redirecciones.
    text_md: El retest ficticio añade un bloqueo de destinos internos directos, pero mantiene redirecciones
      a ese mismo destino. Esta diferencia explica por qué el hallazgo sigue abierto. Un filtro del primer
      hostname no protege las resoluciones y destinos efectivos posteriores.
  - lead: Evitar conclusiones excesivas.
    text_md: No se afirma que una SSRF permita alcanzar cualquier red o tomar el control de un host. PR:L
      refleja la cuenta requerida; C:H e I:L son las capacidades concretas del servicio de documentos
      representado. La disponibilidad no se prueba ni se puntúa.
  remediation_summary:
    short_md: Desactivar destinos arbitrarios y restringir la salida de red del proceso. Proteger la interfaz
      interna con identidad de servicio. Mantener únicamente las integraciones necesarias con un contrato
      explícito de método, ruta y formato de respuesta.
    medium_md: Aplicar una política sobre el destino resuelto y cada salto de redirección. Probar IPv4,
      IPv6, cambios de resolución y rutas indirectas con receptores controlados. Limitar tiempos y tamaños
      de respuesta para que la vista previa no consuma recursos sin límite.
    long_md: Cerrar cuando tanto el acceso directo como el redirigido a recursos fuera de política fallen.
      Conservar una integración positiva que siga funcionando y una prueba de que el servicio interno
      rechaza solicitudes sin identidad, incluso desde una red permitida.
  asset_uids:
  - 7993cf01-787a-590b-833f-59bb95756739
  - 9a4db157-7733-5b63-8337-4eddedc0bbd5
  evidence_uids:
  - 1e1a4f84-5740-599f-bd56-41cd69f4d35a
  owner: Equipo de plataforma
  due_date: '2026-10-09'
  status: in_progress
  retests:
  - uid: 09fe9744-c3bd-59d7-a15c-a9a5f8c3c75d
    result: partial
    tested_on: '2026-09-30'
    assessor: Evaluador ficticio del escenario
    notes_md: 'Retest ficticio RT05. La URL interna directa es rechazada, pero una redirección desde el
      receptor canario vuelve a alcanzar el recurso interno. No se repite el cambio de etiqueta: la lectura
      del marcador basta para demostrar que la frontera sigue abierta. F05 permanece en corrección.'
    evidence_uids:
    - 111fd17c-4850-5f39-bf1c-0670a77d5d2f
- uid: 75f54222-a209-576b-a0be-7a144240bc84
  id: F06
  mode: vuln
  title: Credencial de servicio publicada en un artefacto de CI
  severity: high
  cvss: '8.1'
  cvss_vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N
  cvss_version: '3.1'
  cwe: CWE-798
  affected: ci.nimbus.example; api.nimbus.example
  description_md: El paquete de diagnóstico de una compilación incorpora un archivo de configuración con
    una credencial reutilizable. Los miembros con lectura de artefactos pueden recuperarla. La identidad
    de servicio dispone de permisos de lectura y modificación en la API de pedidos.
  impact_md: Un usuario de CI con permisos de lectura puede asumir los permisos de una identidad más privilegiada.
    Se modela consulta y actualización de pedidos canario. La cuenta no administra el sistema operativo
    ni la facturación del proveedor de infraestructura.
  remediation_md: Revocar y rotar la credencial, retirar el artefacto y revisar sus accesos históricos.
    Emitir credenciales de corta duración desde un gestor de secretos y limitar los permisos del servicio.
    Excluir secretos del proceso de empaquetado y detectar regresiones antes de publicar.
  references:
  - https://cwe.mitre.org/data/definitions/798.html
  - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
  walkthrough:
  - lead: Contexto y precondiciones.
    text_md: El artefacto build-demo-062 pertenece a un pipeline ficticio. La cadena SECRET-DEMO-NO-VALIDO
      es un marcador editorial, no una credencial funcional. Las capacidades de svc_order_sync se describen
      como parte del escenario para explicar la consecuencia del acceso a secretos.
  - lead: Separar permiso de lectura y permiso de ejecución.
    text_md: La cuenta de desarrollador puede descargar artefactos, pero no administrar pedidos. Registrar
      esa diferencia antes de usar la identidad de servicio en el guion. Si ambos actores tuvieran los
      mismos privilegios, la conclusión sobre elevación requeriría un análisis distinto.
  - lead: Localizar el origen de la exposición.
    text_md: E06 identifica el archivo de configuración incluido por una regla de empaquetado demasiado
      amplia. El error se atribuye al contenido del artefacto y a su distribución, no a la mera existencia
      de una variable de entorno. El informe conserva una etiqueta sintética en lugar del secreto.
    figure:
      src: img/e06.png
      caption: 'E06. Evidencia sintética: El acceso de lectura al artefacto expone una identidad con mayores
        permisos. No es una captura de una prueba ejecutada.'
  - lead: Modelar una comprobación mínima.
    text_md: La representación utiliza el servicio para leer y modificar una nota de un pedido canario.
      No extrae un catálogo completo. Después se restaura el valor. El resultado demuestra los permisos
      atribuidos al secreto en el ejemplo, sin afirmar que una credencial real haya sido utilizada.
  - lead: Evaluar la retirada completa.
    text_md: Borrar el archivo de una compilación posterior no invalida las copias descargadas ni el token
      anterior. El cierre necesita confirmar revocación, rotación, permisos reducidos y revisión de retención
      en cachés o almacenes secundarios.
  remediation_summary:
    short_md: Revocar el secreto anterior antes de considerar resuelto el incidente representado. Retirar
      las copias que controla el pipeline y registrar qué repositorios de artefactos y cachés se revisaron.
      Coordinar la rotación para evitar una interrupción innecesaria.
    medium_md: Separar configuración pública y secretos en tiempo de ejecución. Reducir svc_order_sync
      a las operaciones y organizaciones que necesita. Impedir la publicación si un análisis de contenido
      detecta formatos de secreto o archivos prohibidos, con excepciones revisadas y trazables.
    long_md: 'El criterio de cierre exige que el secreto antiguo falle, que el nuevo artefacto no lo contenga
      y que la identidad limitada mantenga el flujo legítimo. El estado sigue en corrección: este documento
      no representa todavía un retest concluyente de esa rotación.'
  asset_uids:
  - 97681ba0-a07d-5c86-bc81-b2ab2426e2d4
  - 7993cf01-787a-590b-833f-59bb95756739
