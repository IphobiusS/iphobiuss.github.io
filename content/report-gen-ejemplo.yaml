- uid: ace05d7d-745c-58d1-b909-5ac8f2c6c8e6
  id: F07
  mode: vuln
  title: Derechos de replicación del dominio asignados a una cuenta operativa
  severity: high
  cvss: '8.8'
  cvss_vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H
  cvss_version: '3.1'
  cwe: CWE-269
  affected: dc01.ad.nimbus.example
  description_md: La cuenta operativa svc_inventory tiene los derechos de replicación Get-Changes y Get-Changes-All
    sobre el contexto de nombres del dominio. Esa delegación excede su función de inventario y permite
    solicitar datos de dominio sensibles mediante replicación.
  impact_md: El escenario concede una vía hacia secretos de autenticación y compromiso amplio del dominio.
    La comprobación didáctica se limita a una identidad canario. Las métricas altas de integridad y disponibilidad
    reflejan el impacto potencial del control del dominio; no representan borrado, parada ni extracción
    masiva.
  remediation_md: Retirar la delegación innecesaria, revisar permisos heredados y grupos que la conceden,
    y separar inventario de funciones de replicación. Investigar actividad de la identidad y planificar
    la rotación de secretos según el alcance realmente determinado.
  references:
  - https://cwe.mitre.org/data/definitions/269.html
  - https://learn.microsoft.com/en-us/windows/win32/adschema/r-ds-replication-get-changes-all
  walkthrough:
  - lead: Contexto y precondiciones.
    text_md: DC01 y el dominio ad.nimbus.example son ficticios. El modelo entrega una cuenta operativa
      válida y conectividad al controlador de dominio. No se incluyen hashes, contraseñas ni material
      de autenticación real; la identidad canario solo ilustra el criterio de confirmación.
  - lead: Revisar permisos efectivos.
    text_md: Comprobar tanto las entradas explícitas como la pertenencia transitiva a grupos y la herencia.
      E07 representa la combinación de los dos derechos sobre la raíz del dominio. Un permiso con nombre
      parecido sobre una unidad organizativa distinta no demostraría el mismo alcance.
  - lead: Distinguir configuración y confirmación.
    text_md: La revisión de ACL acredita una condición de riesgo. El guion añade una solicitud de replicación
      limitada a demo-repl-canary para ilustrar cómo se confirmaría la capacidad. Las salidas mostradas
      son sintéticas; no se ejecutó una extracción de secretos durante la creación de este informe.
    figure:
      src: img/e07.png
      caption: 'E07. Evidencia sintética: Una identidad de inventario recibe facultades de replicación
        que no necesita. No es una captura de una prueba ejecutada.'
  - lead: Acotar la cadena de impacto.
    text_md: El compromiso del dominio es una consecuencia modelada de la exposición de secretos de autenticación,
      no un paso adicional ejecutado. No se incluyen persistencia, modificación de políticas ni operaciones
      destructivas. El equipo tendría que valorar el alcance con su telemetría y procedimientos de respuesta.
  - lead: Justificar la prioridad.
    text_md: La puntuación base es alta con PR:L porque se necesita una identidad de dominio. La prioridad
      de negocio es P0 por su alcance transversal. Esa diferencia muestra por qué CVSS y prioridad operativa
      se registran por separado, en lugar de elevar artificialmente el vector.
  remediation_summary:
    short_md: Suspender o limitar la identidad comprometible y retirar los derechos injustificados tras
      comprobar dependencias legítimas. Preservar los registros de autenticación y replicación relevantes.
      Una rotación aislada no corrige una delegación que sigue existiendo.
    medium_md: Inventariar principales con derechos de replicación y documentar excepciones autorizadas.
      Revisar eventos de acceso a objetos y solicitudes de replicación desde equipos que no son controladores,
      según la auditoría habilitada y la telemetría realmente disponible.
    long_md: Verificar con la misma identidad que la solicitud canario es denegada, mientras la replicación
      legítima entre controladores continúa. Si se acreditara exposición real de secretos, la recuperación
      del dominio requeriría un procedimiento adicional; este caso ficticio no afirma haberlo ejecutado.
  asset_uids:
  - 47b6a54c-4280-59e1-874e-c19578b1a627
  evidence_uids:
  - 6622fc6c-e102-5b8d-aeaa-63bffea4ff5a
  owner: Equipo de identidad
  due_date: '2026-10-03'
  status: in_progress
  retests: []
- uid: 82e71acc-cd39-5e99-a7ec-5aa957a373fd
  id: F08
  mode: vuln
  title: Delegación de membresía sobre un grupo administrador de servidores
  severity: high
  cvss: '8.8'
  cvss_vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H
  cvss_version: '3.1'
  cwe: CWE-269
  affected: dc01.ad.nimbus.example; winapp01.ad.nimbus.example
  description_md: Helpdesk-L1 puede modificar la membresía de APP-Server-Admins. Este segundo grupo es
    administrador local en WINAPP01 mediante una política de dominio. La delegación permite elevar una
    cuenta de soporte a administración del servidor de aplicación.
  impact_md: El modelo permite acceso administrativo al host de aplicación y a sus datos y servicios.
    No se equipara automáticamente esa administración local con control del dominio. La prueba canario
    solo comprueba el permiso efectivo y una operación administrativa inocua.
  remediation_md: Retirar el permiso de escritura de membresía y revisar la ruta completa de grupos y
    políticas. Separar la gestión de soporte de la administración de servidores; aplicar concesiones temporales
    y aprobadas cuando la operación lo requiera.
  references:
  - https://cwe.mitre.org/data/definitions/269.html
  - https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/best-practices-for-securing-active-directory
  walkthrough:
  - lead: Contexto y precondiciones.
    text_md: La cuenta helpdesk.demo empieza con funciones de soporte limitadas. APP-Server-Admins administra
      exclusivamente WINAPP01 en este modelo. Se utiliza una identidad canario y una sesión nueva para
      reflejar correctamente los cambios de token y evitar atribuir privilegios de sesiones anteriores.
  - lead: Reconstruir la ruta de privilegios.
    text_md: 'E08 muestra tres relaciones distintas: permiso sobre member, pertenencia al grupo y asignación
      de administrador local. Ninguna se deduce únicamente del nombre del grupo. La política aplicada
      al servidor confirma el último tramo de la cadena.'
  - lead: Representar un cambio reversible.
    text_md: El guion incorpora demo-helpdesk-canary al grupo y abre una sesión nueva en WINAPP01. La
      capacidad administrativa se verifica con lectura de un recurso canario restringido, sin instalar
      servicios ni ejecutar cargas. El cambio se revierte al finalizar.
    figure:
      src: img/e08.png
      caption: 'E08. Evidencia sintética: La ruta de delegación termina en administración local, no en
        control probado del dominio. No es una captura de una prueba ejecutada.'
  - lead: Revisar herencia y persistencia del permiso.
    text_md: Comprobar si la entrada procede del objeto, una unidad organizativa o un grupo intermedio.
      Quitar una membresía canario no elimina la posibilidad de volver a agregarla. El cierre debe corregir
      la delegación y revisar cambios realizados durante la exposición.
  - lead: Distinguir corrección comunicada y verificada.
    text_md: 'El estado actual del ejemplo es Corrección comunicada: el equipo ficticio informa de una
      nueva política, pero el retest aún no está representado. No se presenta un aviso de despliegue como
      evidencia de cierre ni se reduce la severidad original.'
  remediation_summary:
    short_md: Retirar la delegación excesiva y revisar miembros recientes del grupo administrador. Confirmar
      que el cambio no se vuelve a aplicar desde una plantilla o política de configuración. Documentar
      las tareas de soporte que necesitan una alternativa legítima.
    medium_md: Separar grupos de soporte, cuentas administrativas y ámbitos de servidores. Probar que
      la cuenta helpdesk.demo ya no puede agregar ni quitar miembros. Verificar los permisos efectivos,
      además de comparar la configuración deseada.
    long_md: 'Cerrar cuando un retest rechace la modificación y una sesión nueva carezca de administración
      local, conservando las tareas autorizadas de soporte. El despliegue comunicado no basta: este informe
      mantiene el estado sin verificar hasta disponer de esa evidencia.'
  asset_uids:
  - 47b6a54c-4280-59e1-874e-c19578b1a627
  - d9a8ef3e-7b86-5b25-ab7c-9ff47c427c48
  evidence_uids:
  - 8a8883a0-b45d-5168-ae73-9a07ecbd3782
  owner: Equipo de infraestructura
  due_date: '2026-10-09'
  status: reported_fixed
  retests: []
- uid: 1d016fca-00fb-5170-a71c-9104d81f64cf
  id: F09
  mode: vuln
  title: XSS almacenado en comentarios del portal de soporte
  severity: medium
  cvss: '5.4'
  cvss_vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:L/I:L/A:N
  cvss_version: '3.1'
  cwe: CWE-79
  affected: portal.nimbus.example
  description_md: Los comentarios conservan fragmentos de HTML que se insertan sin un saneado adecuado
    en el navegador del agente de soporte. Una cuenta de cliente puede guardar contenido activo que se
    procesa cuando el agente abre el ticket.
  impact_md: La demostración modifica un marcador visible y accede a información limitada de la página
    abierta. No representa robo de cookies, acceso total a la cuenta del agente ni extracción de datos
    hacia un tercero. El impacto depende de que un agente visualice el comentario.
  remediation_md: Renderizar texto mediante APIs seguras y codificación contextual. Si se necesita HTML
    enriquecido, aplicar un saneador mantenido con una política reducida. Revisar contenido ya almacenado
    y usar CSP como defensa complementaria, sin convertirla en la corrección principal.
  references:
  - https://cwe.mitre.org/data/definitions/79.html
  - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
  walkthrough:
  - lead: Contexto y precondiciones.
    text_md: La cuenta cliente.demo crea un ticket y agente.demo lo consulta desde una sesión separada.
      El marcador de demostración solo cambia un elemento de la página. No abre conexiones externas ni
      intenta persistir fuera del comentario del caso ficticio.
  - lead: Confirmar persistencia del contenido.
    text_md: Guardar un comentario de texto normal y volver a abrirlo con la segunda identidad. El guion
      comprueba que el contenido proviene del almacenamiento, no de parámetros del enlace ni de herramientas
      del navegador utilizadas por el propio agente.
  - lead: Diferenciar HTML y ejecución.
    text_md: 'E09 representa el marcador XSS-DEMO-ACTIVO en el DOM de la sesión del agente. Mostrar una
      etiqueta HTML no demuestra por sí solo ejecución de script: el cambio visible del marcador es la
      observación elegida para esa distinción dentro del escenario.'
    figure:
      src: img/e09.png
      caption: 'E09. Evidencia sintética: El contenido almacenado cruza al contexto de ejecución del navegador
        del agente. No es una captura de una prueba ejecutada.'
  - lead: Acotar contexto y capacidades.
    text_md: El comentario se procesa en el origen del portal. La demostración no atribuye capacidad de
      leer cookies HttpOnly ni de evitar controles de autorización del servidor. El acceso a datos y las
      acciones disponibles seguirían limitados por la sesión y las defensas concretas del navegador.
  - lead: Justificar interacción y alcance.
    text_md: UI:R refleja la apertura del ticket por la víctima; PR:L, la cuenta necesaria para comentar.
      S:C representa el paso desde la aplicación vulnerable al contexto de seguridad del navegador del
      agente. C:L e I:L corresponden a las capacidades limitadas representadas.
  remediation_summary:
    short_md: Desactivar temporalmente el HTML de comentarios y neutralizar entradas almacenadas que incumplan
      la política. Conservar el texto útil de los tickets y documentar qué transformaciones se aplicaron
      para evitar pérdida innecesaria de información.
    medium_md: Revisar el renderizado de comentarios en detalle, búsquedas, notificaciones y vistas previas.
      Incorporar pruebas sobre atributos, URLs y elementos no permitidos en el formato enriquecido. El
      control debe aplicarse en todos los consumidores del mismo contenido.
    long_md: Cerrar cuando los comentarios se muestren como texto o HTML permitido y el marcador no se
      active en ninguna vista. Mantener un comentario legítimo con formato como control positivo. El escenario
      todavía no incluye un retest concluyente de esta corrección.
  asset_uids:
  - a56b6769-1b56-53fb-bc31-98623f580a97
  evidence_uids:
  - f862f5a3-88a0-5ffa-96d1-75ac8634236d
  owner: Equipo de aplicaciones
  due_date: '2026-10-23'
  status: in_progress
  retests: []
- uid: ebf9e7f3-805c-5c10-bbcb-0373ad2caa8b
  id: F10
  mode: vuln
  title: CORS con credenciales para orígenes no autorizados
  severity: medium
  cvss: '6.5'
  cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:N/A:N
  cvss_version: '3.1'
  cwe: CWE-942
  affected: api.nimbus.example; auth.nimbus.example
  description_md: La API refleja el encabezado Origin y permite credenciales sin comprobar una lista de
    orígenes autorizados. La sesión del escenario utiliza cookies SameSite=None; Secure. Un navegador
    que admite esas cookies entre sitios puede exponer respuestas autenticadas a un origen ajeno.
  impact_md: Se modela lectura de datos de pedidos desde una página externa visitada por un usuario autenticado.
    No se afirma que la presencia de un encabezado CORS, aislada, baste para explotar el fallo ni que
    todos los navegadores permitan cookies de terceros.
  remediation_md: Definir una lista exacta de orígenes por entorno y evitar reflejar valores no confiables.
    Permitir credenciales solo donde sean necesarias; comprobar la política de cookies y caché. No usar
    comodines de subdominio como sustituto de una lista de aplicaciones autorizadas.
  references:
  - https://cwe.mitre.org/data/definitions/942.html
  - https://cheatsheetseries.owasp.org/cheatsheets/HTML5_Security_Cheat_Sheet.html
  walkthrough:
  - lead: Contexto y precondiciones.
    text_md: El origen receptor es receptor.canario.nimbus.example y solo contiene datos de demostración.
      El navegador del guion permite la cookie entre sitios. Esta condición se declara expresamente porque
      un bloqueo de cookies de terceros puede interrumpir la cadena incluso si la política del servidor
      es incorrecta.
  - lead: Verificar la configuración del servidor.
    text_md: 'Comparar una petición con el origen legítimo y otra con el receptor canario. E10 muestra
      que ambos son aceptados con credenciales. La combinación de asterisco y credenciales no se utiliza
      como prueba: los navegadores no la tratan como una autorización válida de lectura autenticada.'
  - lead: Representar la comprobación en navegador.
    text_md: La página canario solicita el recurso con credenciales y accede al cuerpo de la respuesta.
      Ese acceso por JavaScript es la condición relevante; obtener un 200 con una herramienta HTTP no
      demostraría por sí mismo una vulneración de la política del navegador.
    figure:
      src: img/e10.png
      caption: 'E10. Evidencia sintética: La lectura autenticada requiere que se cumplan también las condiciones
        del navegador. No es una captura de una prueba ejecutada.'
  - lead: Mantener una matriz de condiciones.
    text_md: El guion diferencia sesión presente o ausente y cookies permitidas o bloqueadas. Solo la
      combinación de sesión válida, envío de cookies y política CORS permisiva representa lectura autenticada.
      El informe no transforma la configuración en una afirmación universal sobre todos los usuarios.
  - lead: Definir el alcance de la valoración.
    text_md: PR:N describe al actor que controla el origen receptor; UI:R refleja que la víctima debe
      visitarlo. C:H corresponde a la API de pedidos accesible en el modelo. No se representan cambios
      de estado ni interrupción, por lo que I y A permanecen en N.
  remediation_summary:
    short_md: Retirar los orígenes no autorizados y comprobar el funcionamiento de los clientes legítimos.
      Revisar los encabezados de caché para que una respuesta autorizada para un origen no se reutilice
      de forma incorrecta para otro.
    medium_md: Centralizar la política CORS por entorno. Probar origen exacto permitido, origen ajeno,
      valor null y subdominios que no correspondan a clientes. Revisar cookies y controles de autorización
      de cada endpoint sin asumir que CORS sustituye la autenticación.
    long_md: 'Cerrar con una verificación de navegador: el cliente legítimo puede leer la respuesta y
      el receptor canario no. Las variantes con sesión ausente deben seguir rechazando acceso. El retest
      ficticio incluido representa esos controles positivos y negativos.'
  asset_uids:
  - 7993cf01-787a-590b-833f-59bb95756739
  - 3855f32e-8146-5d1b-b417-9eccc2e47140
  evidence_uids:
  - 55696336-aadc-5bdd-ad40-34100602c432
  owner: Equipo de API
  due_date: '2026-10-23'
  status: verified_fixed
  retests:
  - uid: 24dd4938-9e5d-574d-9b78-9f6c9a469733
    result: fixed
    tested_on: '2026-09-30'
    assessor: Evaluador ficticio del escenario
    notes_md: Retest ficticio RT10. El origen legítimo conserva la lectura autenticada. El receptor canario
      y Origin:null no reciben autorización CORS; JavaScript no accede al cuerpo. Las peticiones sin sesión
      siguen rechazadas. El ejemplo representa una corrección verificada, no solo un cambio de encabezados.
    evidence_uids:
    - 0cce3187-5d6a-5937-a05e-82017fcfa340
- uid: 09cbd4dd-08b4-54d8-b448-94ce739ac6fe
  id: F11
  mode: vuln
  title: Sesión reutilizable después del cierre de sesión
  severity: medium
  cvss: '5.4'
  cvss_vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:L/A:N
  cvss_version: '3.1'
  cwe: CWE-613
  affected: auth.nimbus.example; portal.nimbus.example
  description_md: El cierre de sesión borra la cookie del navegador, pero el servidor mantiene válida
    la sesión anterior hasta su expiración. La misma credencial de sesión permite consultar y modificar
    preferencias de la cuenta después de cerrar sesión.
  impact_md: Un actor que ya disponga de esa sesión conserva acceso limitado al perfil y las preferencias.
    El informe no atribuye al hallazgo una forma de robar el token ni acceso a otras cuentas. La duración
    restante de la sesión determina la ventana de exposición.
  remediation_md: Revocar la sesión en el servidor al cerrar sesión y al realizar cambios sensibles de
    cuenta. Definir la invalidación de tokens de actualización y las excepciones de sesiones múltiples.
    Una cookie eliminada en el cliente no acredita revocación del lado servidor.
  references:
  - https://cwe.mitre.org/data/definitions/613.html
  - https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html
  walkthrough:
  - lead: Contexto y precondiciones.
    text_md: Se conserva una copia sintética de la sesión de usuario.a antes de cerrar sesión en el navegador.
      Se prueba únicamente esa identidad y un endpoint de preferencias. Las cadenas de sesión se sustituyen
      por etiquetas no funcionales.
  - lead: Confirmar la sesión inicial.
    text_md: Consultar el perfil con SESSION-DEMO-A y comprobar el identificador del sujeto. Guardar la
      hora lógica del escenario y la expiración prevista. El control permite distinguir la reutilización
      del mismo token de una nueva autenticación automática.
  - lead: Cerrar sesión y reutilizar la misma credencial.
    text_md: 'E11 representa la eliminación de la cookie y una nueva petición con el valor anterior. El
      servidor devuelve el perfil. No basta con ver la página en la caché del navegador: la evidencia
      elegida es una respuesta autenticada nueva con su identificador de petición.'
    figure:
      src: img/e11.png
      caption: 'E11. Evidencia sintética: El servidor sigue aceptando la sesión anterior aunque el navegador
        haya borrado la cookie. No es una captura de una prueba ejecutada.'
  - lead: Comprobar una operación limitada.
    text_md: Modificar una preferencia canario y verificarla desde una sesión nueva legítima. Restaurar
      el valor. La operación no afecta a credenciales, pedidos ni permisos de otras personas. El alcance
      limitado explica C:L e I:L.
  - lead: Separar origen del acceso y persistencia.
    text_md: PR:L expresa el requisito de poseer una sesión válida del usuario. Este hallazgo describe
      la persistencia de ese acceso después de logout; no demuestra robo de cookies, phishing ni un bypass
      de contraseña. El estado permanece abierto en el ejemplo.
  remediation_summary:
    short_md: Documentar y aplicar la revocación central de sesiones afectadas. Revisar la duración de
      tokens y el comportamiento de clientes que mantienen varias sesiones. Un plazo de expiración más
      corto reduce la ventana, pero no cumple por sí solo la semántica de logout.
    medium_md: Añadir pruebas de logout, cambio de contraseña, recuperación de cuenta y revocación administrativa.
      Comprobar tanto tokens de acceso como de actualización. El diseño debe aclarar si una acción revoca
      una sesión o todas las sesiones del usuario.
    long_md: 'El criterio de cierre exige que el token previo falle en una petición nueva, que no permita
      actualizar preferencias y que una sesión nueva legítima funcione. Este caso no presenta un retest:
      la corrección permanece pendiente dentro del escenario.'
