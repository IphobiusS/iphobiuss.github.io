    result: fixed
    tested_on: '2026-09-30'
    assessor: Evaluador ficticio del escenario
    notes_md: Retest ficticio RT01. La búsqueda parametrizada conserva el resultado legítimo y trata las
      entradas de control como datos. La cuenta de búsqueda ya no puede actualizar demo_note. Los pedidos
      ajenos no se devuelven. Se representa el cierre de F01, conservando la severidad original para trazabilidad.
    evidence_uids:
