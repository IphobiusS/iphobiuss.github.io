name: Build, validate and publish website

on:
  push:
    branches: [source]
  pull_request:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements-build.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build from source and prove repeatability
        run: |
          npm run build:all
          npm run test:build
          npm run test:publish
          npm run test:links
          npm run test:report-assets
      - name: Browser regressions
        run: |
          npm run test:evolution
          npm run test:home-actions
          npm run test:journey
          npm run test:graphs
          npm run test:layout

  publish:
    if: github.ref == 'refs/heads/source' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/build-site.py
      - name: Publish only generated files and wait for Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish-site.py
