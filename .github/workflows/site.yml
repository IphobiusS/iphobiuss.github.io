name: Build, validate and publish website

on:
  push:
    branches: [source]
  pull_request:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements-build.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - name: Build from source and prove repeatability
        run: |
          npm run build:all
          npm run test:build
          npm run test:publish
          npm run test:links
          npm run test:report-assets
          npm run test:public-cv
          npm run test:performance
          npm run test:release-sync
          npm run test:skills
      - name: Verify isolated HTTP authorization lab in Docker
        run: |
          python tests/test_http_access_lab.py
          docker build -t iphobiuss-http-access:1.0.0 content/labs/http-access
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 64 --memory 128m --cpus 1 iphobiuss-http-access:1.0.0
      - name: Verify Firefox and mobile resource budgets
        timeout-minutes: 8
        env:
          SITE_COMPAT_HEADED: '1'
          SITE_COMPAT_BROWSERS: firefox
        run: xvfb-run -a npm run test:compatibility
      - name: Verify Matrix entrance
        run: npm run test:intro
      - name: Verify portfolio and reporting evidence
        run: |
          npm run test:portfolio
          npm run test:report-status
      - name: Verify search filters
        run: npm run test:search-filters
      - name: Verify exercise and English routes
        run: npm run test:evolution
      - name: Verify homepage actions
        run: npm run test:home-actions
      - name: Verify guided journey
        run: npm run test:journey
      - name: Verify case graphs
        run: npm run test:graphs
      - name: Audit all layouts and accessibility
        run: npm run test:layout

      - name: Preserve the exact distribution validated on Linux
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Preserve Firefox evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-compatibility-linux-${{ github.sha }}
          path: audit-v14.6/compatibility/
          if-no-files-found: ignore
          retention-days: 7

  webkit:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      - name: Download the Linux-validated distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist-${{ github.sha }}
          path: dist/
      - name: Download the Linux file manifest and Firefox receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-compatibility-linux-${{ github.sha }}
          path: audit-v14.6/linux-baseline/
      - name: Prove WebKit will test the same commit and every published byte
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          baseline = json.loads(Path('audit-v14.6/linux-baseline/results.json').read_text())
          assert baseline['sourceRevision'] == os.environ['GITHUB_SHA']
          assert baseline['completedEngines'] == ['firefox']
          assert baseline['completeRequestedEngineCoverage'] and 'fatal' not in baseline
          assert baseline['passed'] == baseline['total'] and baseline['total'] > 0
          expected = baseline['distribution']['files']
          actual = {p.relative_to('dist').as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in Path('dist').rglob('*') if p.is_file()}
          assert actual == expected, 'Downloaded distribution differs from the Linux-tested files'
          assert '.nojekyll' in actual, 'Artifact must preserve hidden publication files'
          print(f'WebKit input: {len(actual)} files identical to the Linux-validated distribution.')
          PY
      - name: Verify WebKit on macOS with the complete compatibility journey
        timeout-minutes: 8
        env:
          SITE_COMPAT_HEADED: '1'
          SITE_COMPAT_BROWSERS: webkit
        run: npm run test:compatibility
      - name: Preserve WebKit evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-compatibility-macos-${{ github.sha }}
          path: audit-v14.6/compatibility/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/source' && github.event_name != 'pull_request'
    needs: [validate, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/build-site.py
      - name: Download Firefox completion evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-compatibility-linux-${{ github.sha }}
          path: audit-v14.6/receipts/linux/
      - name: Download WebKit completion evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-compatibility-macos-${{ github.sha }}
          path: audit-v14.6/receipts/macos/
      - name: Require both platforms and match the distribution before publication
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          actual = {p.relative_to('dist').as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in Path('dist').rglob('*') if p.is_file()}
          coverage = {}
          routes = None
          for folder, engine, platform in [('linux', 'firefox', 'linux'), ('macos', 'webkit', 'darwin')]:
              result = json.loads(Path(f'audit-v14.6/receipts/{folder}/results.json').read_text())
              assert result['sourceRevision'] == os.environ['GITHUB_SHA'], 'Receipt is from another source commit'
              assert result['operatingSystem']['platform'] == platform
              assert result['browserMode'] == 'headed'
              assert result['requestedEngines'] == [engine] and result['completedEngines'] == [engine]
              assert result['completeRequestedEngineCoverage'] and 'fatal' not in result
              assert result['passed'] == result['total'] == len(result['results']) and result['total'] > 0
              assert all(check['passed'] and check['engine'] == engine for check in result['results'])
              assert result['distribution']['files'] == actual, 'Rebuilt distribution differs from browser-tested files'
              assert result['distribution']['fileCount'] == len(actual)
              current_routes = sorted(result['testedRoutes'])
              assert current_routes == sorted(p.name for p in Path('dist').glob('*.html'))
              assert routes is None or routes == current_routes, 'Engines tested different page inventories'
              routes = current_routes
              coverage[engine] = {'platform': platform, 'version': result['versions'][engine], 'checks': result['passed']}
          combined = {'sourceRevision': os.environ['GITHUB_SHA'], 'completeRequiredEngineCoverage': True,
                      'coverage': coverage, 'publishedFileCount': len(actual), 'testedRoutes': routes}
          Path('audit-v14.6/compatibility-matrix.json').write_text(json.dumps(combined, indent=2) + '\n')
          print(json.dumps(combined))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Browser publication gate\n\n| Engine | Platform | Checks |\n| --- | --- | --- |\n')
              for engine, result in coverage.items():
                  summary.write(f"| {engine} {result['version']} | {result['platform']} | {result['checks']}/{result['checks']} |\n")
              summary.write(f"\nBoth engines tested the same {len(actual)} files from this source commit.\n")
          PY
      - name: Publish only generated files and wait for Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish-site.py
